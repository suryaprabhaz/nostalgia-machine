name: Nostalgia Machine Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate structure
        run: |
          test -s index.html
          test -s js/app.js
          test -s js/engine.js
          test -s js/payment.js
          test -s css/styles.css
